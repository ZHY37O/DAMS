<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic management system</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="login-container w-full max-w-md mx-4">
        <div class="bg-white rounded-xl shadow-2xl p-10">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Login page</h1>
                <p class="text-gray-600">Sign in to access your account</p>
            </div>

            <div class="flex justify-between mb-8 bg-gray-100 p-1 rounded-lg">
                <button class="account-type flex-1 py-2 px-4 rounded-lg text-center" id="doctorBtn">
                    <i class="fas fa-user-md text-blue-600 text-xl mb-2"></i>
                    <p class="text-sm font-medium">Doctor</p>
                </button>
                <button class="account-type flex-1 py-2 px-4 rounded-lg text-center" id="patientBtn">
                    <i class="fas fa-user-injured text-green-600 text-xl mb-2"></i>
                    <p class="text-sm font-medium">Patient</p>
                </button>
                <button class="account-type flex-1 py-2 px-4 rounded-lg text-center" id="adminBtn">
                    <i class="fas fa-cog text-purple-600 text-xl mb-2"></i>
                    <p class="text-sm font-medium">Admin</p>
                </button>
            </div>


            <form action="login.php" method="POST" class="space-y-6">
                <div class="relative">
                    <input type="text" name = "username" id="username" class="floating-input w-full px-4 py-3 border border-gray-300 rounded-lg " />
                    <label for="username" class="floating-label absolute left-4 top-3 text-gray-500 pointer-events-none transition-all duration-200 peer-placeholder-shown:top-3 ">Username</label>
                </div>

                <div class="relative">
                    <input type="password" id="password" name="password" class="floating-input w-full px-4 py-3 border border-gray-300 rounded-lg " />
                    <label for="password" class="floating-label absolute left-4 top-3 text-gray-500 pointer-events-none transition-all duration-200 peer-placeholder-shown:top-3 ">Password</label>
                    <i class="fas fa-eye-slash absolute right-3 top-3.5 text-gray-400 cursor-pointer" id="togglePassword"></i>
                </div>

                <div class="flex justify-between items-center">
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <label for="remember" class="ml-2 block text-sm text-gray-700">Remember me</label>
                    </div>
                    <a href="#" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200">
                    Sign In
                </button>
            </form>
            

            <div id="signup">
                <div class="my-6 flex items-center">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="mx-4 text-gray-500">or</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>

                <div class="text-center">
                    <p class="text-gray-600">Don't have an account? </p>
                </div>            
                <button class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200">
                        Create Account
                </button>
            </div>

        </div>

    <script src="style/style.js"></script>
</body>
</html>
